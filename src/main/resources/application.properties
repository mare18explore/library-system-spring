spring.application.name=library-system-spring

# keep database work inside the service layer, also silences the open-in-view warning
spring.jpa.open-in-view=false

# postgres running in docker, the ${...:default} format lets docker override these later
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:library}

# update creates missing tables but keeps existing data, so nothing gets wiped on restart
spring.jpa.hibernate.ddl-auto=update

# prints the sql hibernate runs, handy for seeing what jpa is doing
spring.jpa.show-sql=true