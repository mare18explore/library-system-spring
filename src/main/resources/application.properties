spring.application.name=library-system-spring
# keep database work inside the service layer, also silences the open-in-view warning
spring.jpa.open-in-view=false

# fixed name for the in-memory database so the h2 console url is always the same
spring.datasource.url=jdbc:h2:mem:library

# lets us look inside the database at localhost:8080/h2-console while developing
spring.h2.console.enabled=true

# prints the sql hibernate runs, handy for learning what jpa is doing behind the scenes
spring.jpa.show-sql=true